[package]
name = "disktree-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The line protocol between a running disktree window and an agent"

[lints]
workspace = true

[dependencies]
disktree-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = "3"
