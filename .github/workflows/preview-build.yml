name: Windows ARM removal investigation

# Diagnostic branch only. Dispatch uses this branch's workflow definition.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Run the controlled scheduling comparison
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  reproduce:
    if: inputs.experiment
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep scratch on the disposable runner
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "RUST_BACKTRACE=1" >> $env:GITHUB_ENV
          "CARGO_TERM_COLOR=never" >> $env:GITHUB_ENV
          New-Item -ItemType Directory evidence
          git rev-parse HEAD | Tee-Object evidence/head.txt
          Get-CimInstance Win32_Processor | Format-List Name,NumberOfLogicalProcessors,Architecture | Tee-Object evidence/host.txt
      - uses: ./.github/actions/setup-rust
      - name: Compile the diagnostic test binary once
        run: |
          $messages = cargo test --locked -p disktree-app --features removal-diagnostics --bin pwrdisk --no-run --message-format=json 2> evidence/build-stderr.txt
          $buildExit = $LASTEXITCODE
          $messages | Out-File evidence/build.jsonl
          if ($buildExit -ne 0) { exit $buildExit }
          $binary = $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'pwrdisk' -and $_.profile.test -and $_.executable } | Select-Object -Last 1
          if (-not $binary) { throw 'No application test binary was built' }
          "REMOVAL_TEST_BINARY=$($binary.executable)" >> $env:GITHUB_ENV
      - name: Scheduling pressure with the original polling assertion
        id: stress
        continue-on-error: true
        run: |
          & $env:REMOVAL_TEST_BINARY --test-threads=16 --nocapture 2>&1 | Tee-Object evidence/concurrency-16.txt
          exit $LASTEXITCODE
      - name: Default concurrency control
        id: control
        continue-on-error: true
        run: |
          & $env:REMOVAL_TEST_BINARY --nocapture 2>&1 | Tee-Object evidence/default-concurrency.txt
          exit $LASTEXITCODE
      - name: Preserve investigation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm-removal-evidence
          path: evidence/
          retention-days: 7
      - name: Report actual experiment outcomes
        if: always()
        env:
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          CONTROL_OUTCOME: ${{ steps.control.outcome }}
        run: |
          if ($env:STRESS_OUTCOME -ne 'success' -or $env:CONTROL_OUTCOME -ne 'success') { exit 1 }

  lint:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - name: Unchanged lint gate
        run: cargo xtask lint
