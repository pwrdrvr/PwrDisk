name: Windows ARM removal investigation

# Diagnostic branch only. Dispatch uses this branch's workflow definition.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep scratch on the disposable runner
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "RUST_BACKTRACE=1" >> $env:GITHUB_ENV
          "CARGO_TERM_COLOR=never" >> $env:GITHUB_ENV
          New-Item -ItemType Directory evidence
          git rev-parse HEAD | Tee-Object evidence/head.txt
          Get-CimInstance Win32_Processor | Format-List Name,NumberOfLogicalProcessors,Architecture | Out-File evidence/host.txt
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - name: Exact focus test without diagnostics
        id: baseline
        continue-on-error: true
        run: |
          cargo test --locked -p disktree-app --bin pwrdisk tests::focus_review_delete_cancel_enter_preserves_the_fixture -- --exact --nocapture 2>&1 | Tee-Object evidence/baseline.txt
          exit $LASTEXITCODE
      - name: Focus test with stage and channel evidence
        id: focused
        continue-on-error: true
        run: |
          cargo test --locked -p disktree-app --features removal-diagnostics --bin pwrdisk tests::focus_review_delete_cancel_enter_preserves_the_fixture -- --exact --nocapture 2>&1 | Tee-Object evidence/focused.txt
          exit $LASTEXITCODE
      - name: Original suite concurrency with stage and channel evidence
        id: suite
        continue-on-error: true
        run: |
          $failed = 0
          for ($iteration = 1; $iteration -le 3; $iteration++) {
            cargo test --locked -p disktree-app --features removal-diagnostics --bin pwrdisk -- --nocapture 2>&1 | Tee-Object "evidence/suite-$iteration.txt"
            if ($LASTEXITCODE -ne 0) { $failed = 1; break }
          }
          exit $failed
      - name: Check formatting without modifying source
        continue-on-error: true
        run: |
          cargo fmt --all -- --check 2>&1 | Tee-Object evidence/fmt.txt
          exit $LASTEXITCODE
      - name: Unchanged lint gate
        continue-on-error: true
        run: |
          cargo xtask lint 2>&1 | Tee-Object evidence/lint.txt
          exit $LASTEXITCODE
      - name: Preserve investigation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm-removal-evidence
          path: evidence/
          retention-days: 7
