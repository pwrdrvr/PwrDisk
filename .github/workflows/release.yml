name: Release

# Push a tag like v0.9.0 to build and publish a release. The tag must match
# the workspace version in Cargo.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.9.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Check the tag and draft the release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version
        id: version
        # Through the environment, not spliced into the script: a tag typed
        # into the dispatch form is text, never shell.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$TAG"
          # The signing environments accept only v* tags, so a rebuild
          # dispatched from a branch would be refused after the draft is
          # made. Fail here instead: dispatch it from the tag itself.
          if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "$tag" ]; then
            echo "Run this workflow from the tag $tag (Use workflow from:" \
              "Tags > $tag), not from $REF_TYPE $REF_NAME" >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A draft, so nobody downloads from a release still missing half its
      # builds; `publish` below makes it public once every build is in.
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "PwrDisk ${TAG#v}" --generate-notes
          fi

  linux:
    name: Build (Linux ${{ matrix.arch }})
    needs: release
    strategy:
      matrix:
        include:
          # The oldest supported runners: their glibc is what the binary
          # needs at least, so building there runs on the most systems.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo xtask test

      - name: Build
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo xtask portable

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="pwrdisk-$VERSION-$ARCH-linux"
          mkdir -p "dist/$name"
          # portable strips before appending; stripping again loses helpers.
          cp target/portable/pwrdisk "dist/$name/"
          cp packaging/install.sh packaging/pwrdisk.desktop.in \
             assets/disktree.svg README.md LICENSE "dist/$name/"
          echo "$VERSION" > "dist/$name/VERSION"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  macos:
    name: Build (macOS ${{ matrix.arch }})
    needs: release
    strategy:
      matrix:
        include:
          # `xtask bundle` names the zip after the machine it runs on, so
          # each architecture builds on its own. Standard hosted runners
          # cost nothing on a public repository. macOS 26's Xcode compiles
          # the Icon Composer icon into the bundle; there is no macOS 26
          # Intel runner, so that build ships the legacy icon alone.
          - { runner: macos-26, arch: aarch64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    # The Developer ID certificate and the notary key live in this
    # environment, which only v* tags may use and which waits for a
    # reviewer's approval. scripts/release/upload-csc-link-from-1password.sh
    # fills it. Only the steps that sign see a secret: the tests and the
    # build run without them.
    environment: apple-signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo xtask test

      # Built before any credential is on the machine, so no build script
      # runs beside them; `xtask bundle` below finds it up to date.
      - name: Build
        run: cargo build --release --locked -p disktree-app

      # A release is never quietly ad hoc signed: one that Gatekeeper
      # rejects is why this fork exists.
      - name: Check signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 \
              APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::apple-signing is missing: ${missing[*]}" >&2
            exit 1
          fi

      # A keychain of its own for the certificate, deleted below and with
      # the runner. The identity is read back from it rather than kept as
      # another secret.
      - name: Signing certificate
        id: keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$password" "$keychain" >/dev/null
          # The existing list, split on purpose into one argument each.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' \
            | head -1)
          if [ -z "$identity" ]; then
            echo "::error::CSC_LINK holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Bundle, sign and notarize
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          trap 'rm -f "$NOTARY_KEY"' EXIT
          cargo xtask bundle --sign "$IDENTITY" --notarize

      # What a downloaded copy will face: a Developer ID signature, a
      # stapled ticket, and Gatekeeper's verdict.
      - name: Verify
        run: |
          set -euo pipefail
          app=target/bundle/PwrDisk.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Remove signing keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          zip="target/bundle/pwrdisk-$VERSION-$ARCH-macos.zip"
          (cd "$(dirname "$zip")" && shasum -a 256 "$(basename "$zip")" \
            > "$(basename "$zip").sha256")
          gh release upload "$TAG" "$zip" "$zip.sha256" --clobber

  windows:
    name: Build (Windows ${{ matrix.arch }})
    needs: release
    strategy:
      matrix:
        include:
          - { runner: windows-2025, arch: x86_64 }
          - { runner: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      # The C runtime linked in, so pwrdisk.exe also runs where the Visual
      # C++ runtime was never installed. For the tests too, so both steps
      # share one build.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo xtask test

      - name: Build
        run: cargo build --release --locked -p disktree-app

      # Unsigned: signing happens in windows-sign, the only job that holds
      # the Azure credentials, and which never checks out or builds source.
      - name: Hand over the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned-${{ matrix.arch }}
          path: target/release/pwrdisk.exe
          if-no-files-found: error
          retention-days: 7

  windows-sign:
    name: Sign and package Windows
    needs: [release, windows]
    # x64 for both architectures: signing hashes the file, it does not run
    # it, and the signing action's tools are x64.
    runs-on: windows-2025
    # Azure Artifact Signing, as in PwrAgent: the four WIN_AZURE_SIGN_*
    # variables and three AZURE_* secrets. Only v* tags, after approval.
    environment: windows-signing
    steps:
      - run: git config --global core.autocrlf false

      - name: Check signing configuration
        shell: bash
        env:
          WIN_AZURE_SIGN_PUBLISHER_NAME: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          missing=()
          for name in WIN_AZURE_SIGN_PUBLISHER_NAME WIN_AZURE_SIGN_ENDPOINT \
              WIN_AZURE_SIGN_ACCOUNT WIN_AZURE_SIGN_PROFILE \
              AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::windows-signing is missing: ${missing[*]}" >&2
            exit 1
          fi

      - name: Collect the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-unsigned-*
          path: unsigned

      - name: Sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          files: |
            ${{ github.workspace }}\unsigned\windows-unsigned-x86_64\pwrdisk.exe
            ${{ github.workspace }}\unsigned\windows-unsigned-aarch64\pwrdisk.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: PwrDisk
          description-url: https://github.com/pwrdrvr/PwrDisk
          # No cache: a cache entry written elsewhere must never supply
          # code to the job that holds the signing credentials.
          cache-dependencies: false

      - name: Verify
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
        run: |
          foreach ($arch in "x86_64", "aarch64") {
            $exe = "unsigned/windows-unsigned-$arch/pwrdisk.exe"
            $sig = Get-AuthenticodeSignature -LiteralPath $exe
            if ($sig.Status -ne "Valid") {
              throw "$exe signature is $($sig.Status): $($sig.StatusMessage)"
            }
            # The certificate's common name, compared whole: a substring
            # of the subject would also accept a lookalike publisher.
            $signer = $sig.SignerCertificate.GetNameInfo(
              [Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($signer -cne $env:EXPECTED_PUBLISHER) {
              throw "$exe is signed by '$signer', not '$env:EXPECTED_PUBLISHER'"
            }
            if (-not $sig.TimeStamperCertificate) {
              throw "$exe has no timestamp, so it stops verifying when the certificate expires"
            }
            "$arch: $($sig.SignerCertificate.Subject)"
          }

      # The release's own README and LICENSE, fetched by API rather than
      # by a checkout: this job runs no code from the repository. In bash,
      # because a PowerShell redirect re-encodes text and would mangle the
      # notice's "Lütke".
      - name: Fetch README and LICENSE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p docs
          for file in README.md LICENSE; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GITHUB_REPOSITORY/contents/$file?ref=$TAG" \
              > "docs/$file"
          done

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in "x86_64", "aarch64") {
            $name = "pwrdisk-$env:VERSION-$arch-windows"
            New-Item -ItemType Directory -Force "dist/$name" | Out-Null
            Copy-Item "unsigned/windows-unsigned-$arch/pwrdisk.exe", docs/README.md, docs/LICENSE "dist/$name/"
            Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
            $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
            # The format `sha256sum -c` reads, with a Unix line ending.
            [IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n")
          }

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.zip dist/*.zip.sha256

  publish:
    name: Publish
    needs: [release, linux, macos, windows-sign]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
