name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests run here, so the token can read and nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pull_request trigger stays path-unfiltered so every job reports on
  # every PR: a skipped job satisfies a required check, a missing one leaves
  # it pending. PRs that touch only docs, Markdown, agent skills and
  # templates skip the jobs below instead. Ported from PwrRoute, which took
  # it from PwrAgent; scripts/ci/classify-changes.test.cjs runs this script
  # against fixtures, and the allowlist's reasons are at its top. Should
  # branch protection come, note that a skipped matrix job reports one check
  # under its unexpanded name, `Test (${{ matrix.name }})`, so require the
  # other jobs or an aggregate, not a matrix leg.
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    # pulls.listFiles needs pull-requests: read; no other job gets it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Only an explicit false from a successful classifier may skip CI.
      code_impacting: ${{ steps.classify.outcome != 'success' || steps.classify.outputs.code_impacting != 'false' }}
    steps:
      - name: Classify changed files
        id: classify
        # A script/runtime failure must select full CI, too.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.notice(`Running full CI: ${reason}`);
            };

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events always run full CI`);
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (!Array.isArray(files) || !Number.isSafeInteger(reportedCount) ||
                reportedCount <= 0 || files.length !== reportedCount) {
              fullCi(
                `changed-file list was incomplete (received ${files?.length} of ${reportedCount})`,
              );
              return;
            }

            // Unknown/malformed entries are not evidence for skipping CI.
            if (files.some((file) => !file || typeof file.filename !== "string" ||
                file.filename.length === 0 ||
                (file.previous_filename !== undefined &&
                 (typeof file.previous_filename !== "string" || file.previous_filename.length === 0)) ||
                (file.status === "renamed" && !file.previous_filename)) ||
                new Set(files.map((file) => file.filename)).size !== reportedCount) {
              fullCi("changed-file list had invalid or duplicate entries");
              return;
            }

            const isNonCodePath = (path) => {
              // Read by xtask's release check and its tests.
              if (path === "CHANGELOG.md") return false;
              return path === ".github/dependabot.yml" ||
                path.startsWith("docs/") ||
                path.startsWith(".agents/skills/") ||
                path.startsWith(".github/ISSUE_TEMPLATE/") ||
                path.startsWith(".github/PULL_REQUEST_TEMPLATE/") ||
                path.toLowerCase().endsWith(".md");
            };
            const codeImpactingFile = files.find((file) => {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              return paths.some((path) => !isNonCodePath(path));
            });
            const nonCodeOnly = codeImpactingFile === undefined;

            core.setOutput("code_impacting", String(!nonCodeOnly));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [nonCodeOnly ? "Non-code only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                nonCodeOnly
                  ? "Only documentation, agent skills, PR/issue templates or Dependabot configuration changed; expensive CI jobs are skipped."
                  : `Full CI runs because \`${codeImpactingFile.filename}\` requires it.`,
              )
              .write();

      # Here rather than in `cargo xtask lint`, which stays Rust-only. After
      # the classifier, so a failure turns this check red and, through the
      # job's result, still runs full CI.
      - uses: actions/checkout@v5
        with:
          # The test runs the PR's own script, and this job's token is the
          # only one with pull-requests: read; keep it out of .git/config.
          persist-credentials: false
      - name: Test the classifier
        run: node --test scripts/ci/classify-changes.test.cjs

  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    needs: changes
    # Runs unless the classifier succeeded and said non-code only.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      - uses: actions/checkout@v5

      # What GPUI links against: windowing (Wayland, X11), input, fonts,
      # and the Vulkan loader.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      # Pinned: the lint gate denies clippy::all and ::pedantic, and a newer
      # clippy's new lints are a change to make on purpose, not by surprise.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

  check-macos:
    name: Lint and test (macOS)
    # Apple silicon. No system libraries to install, and no Metal toolchain
    # either: gpui-kit builds GPUI with runtime shader compilation, so the
    # shaders compile when the app starts, not here.
    runs-on: macos-15
    needs: changes
    # Runs unless the classifier succeeded and said non-code only.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

      # The app bundle, signed ad hoc, and the DMG release.yml cuts the same
      # way: catches a broken Info.plist, icon, signature or DMG layout
      # before a release does. This runner's Xcode has no actool 26, so
      # this is the bundle without the Icon Composer icon.
      - name: Bundle
        run: cargo xtask bundle

  bundle-macos-26:
    name: Bundle (macOS 26)
    # The bundle with the Icon Composer icon: Xcode 26's actool compiles it
    # into Assets.car, and the plist names it, which the job checks.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Bundle
        run: cargo xtask bundle

      - name: Icon catalog
        run: |
          app=target/bundle/PwrDisk.app
          test -f "$app/Contents/Resources/Assets.car"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test "$(plutil -extract CFBundleIconName raw "$app/Contents/Info.plist")" = Icon

  windows:
    name: Lint and test (Windows)
    runs-on: windows-2025
    needs: changes
    # Runs unless the classifier succeeded and said non-code only.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      # Check out with the repository's own line endings, as on Linux.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      # Pinned with the Linux job, for the same reason. GPUI needs nothing
      # beyond the Windows SDK the runner already has.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

      - name: Check embedded executable icon
        shell: pwsh
        run: |
          cargo build --release --locked -p disktree-app
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ExecutableIcons {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(
                  string file, int index, IntPtr[] large, IntPtr[] small, uint count);
          }
          '@
          $exe = (Resolve-Path target/release/pwrdisk.exe).Path
          if ([ExecutableIcons]::ExtractIconEx($exe, -1, $null, $null, 0) -lt 1) {
            throw "pwrdisk.exe has no embedded icon"
          }

  # The other half of each release: the same tests on the architectures
  # the release builds for but the jobs above do not run on.
  other-architectures:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux aarch64, runner: ubuntu-24.04-arm }
          - { name: macOS x86_64, runner: macos-15-intel }
          - { name: Windows aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    needs: changes
    # Runs unless the classifier succeeded and said non-code only.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo xtask test
