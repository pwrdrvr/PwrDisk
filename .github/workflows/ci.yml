name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests run here, so the token can read and nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push cancels a PR's stale run, but never main's: only main saves
  # the Rust cache every PR starts from, and a cancelled job saves nothing.
  # A newer main push waits instead, replacing any run already waiting.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# The Rust cache: every Rust job sets up through .github/actions/setup-rust,
# which saves the cache only on main, so PR saves cannot evict the entries
# every PR restores from the 10 GB store, and prunes extra toolchains first
# so image updates keep the key. The reasons and numbers are in README.md
# beside this file, under "The Rust cache".
jobs:
  # The pull_request trigger stays path-unfiltered so every job reports on
  # every PR: a skipped job satisfies a required check, a missing one leaves
  # it pending. PRs that touch only docs, Markdown, agent skills and
  # templates skip the jobs below instead. The bundle checks and the ARM
  # test legs also wait for a packaging input to change, on PRs and on main
  # pushes alike, or for a PR's full-ci label (add it, then push or use
  # Re-run all jobs: Re-run failed jobs keeps the classifier's answer).
  # The classifier was ported from PwrRoute, which took
  # it from PwrAgent; scripts/ci/classify-changes.test.cjs runs this script
  # against fixtures, and the allowlist's reasons are at its top. Should
  # branch protection come, note that a skipped matrix job reports one check
  # under its unexpanded name, `Test (${{ matrix.name }})`, so require the
  # other jobs or an aggregate, not a matrix leg.
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pulls.listFiles needs pull-requests: read; no other job gets it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Only an explicit false from a successful classifier may skip CI.
      code_impacting: ${{ steps.classify.outcome != 'success' || steps.classify.outputs.code_impacting != 'false' }}
      licenses_impacting: ${{ steps.classify.outcome != 'success' || steps.classify.outputs.licenses_impacting != 'false' }}
      packaging_impacting: ${{ steps.classify.outcome != 'success' || steps.classify.outputs.packaging_impacting != 'false' }}
    steps:
      - name: Classify changed files
        id: classify
        # A script/runtime failure must select full CI, too.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fullCi = (reason) => {
              core.setOutput("code_impacting", "true");
              core.setOutput("licenses_impacting", "true");
              core.setOutput("packaging_impacting", "true");
              core.notice(`Running full CI: ${reason}`);
            };

            const {owner, repo} = context.repo;
            const pathsOf = (file) =>
              [file.filename, file.previous_filename].filter(Boolean);
            // Unknown/malformed entries are not evidence for skipping CI.
            const malformed = (files) => files.some((file) => !file ||
              typeof file.filename !== "string" || file.filename.length === 0 ||
              (file.previous_filename !== undefined &&
               (typeof file.previous_filename !== "string" || file.previous_filename.length === 0)) ||
              (file.status === "renamed" && !file.previous_filename)) ||
              new Set(files.map((file) => file.filename)).size !== files.length;

            // Packaging, and the arch-specific breaks the ARM test legs exist for,
            // come from these: what the bundles and installers are built from, the
            // dependencies and toolchain, and CI's own setup.
            const isPackagingPath = (path) =>
              path === "Cargo.lock" || path === "Cargo.toml" ||
              path.endsWith("/Cargo.toml") || path === "rust-toolchain.toml" ||
              path.startsWith(".cargo/") || path.startsWith("packaging/") ||
              path.startsWith("assets/") || path.startsWith("scripts/release/") ||
              path.startsWith("xtask/") || path === "crates/disktree-app/build.rs" ||
              path === ".github/workflows/ci.yml" ||
              path.startsWith(".github/actions/setup-rust/");
            const packagingFile = (files) =>
              files.find((file) => pathsOf(file).some(isPackagingPath));

            if (context.eventName === "push") {
              // Main always lints, tests and checks notices; only packaging and the
              // ARM legs wait for a commit range that needs them.
              core.setOutput("code_impacting", "true");
              core.setOutput("licenses_impacting", "true");
              const runPackaging = (reason) => {
                core.setOutput("packaging_impacting", "true");
                core.notice(`Running packaging checks: ${reason}`);
              };
              const {before, after} = context.payload;
              if (!/^[0-9a-f]{40}$/.test(before ?? "") || /^0+$/.test(before) ||
                  !/^[0-9a-f]{40}$/.test(after ?? "")) {
                runPackaging("the push has no previous commit to compare");
                return;
              }
              let data;
              try {
                ({data} = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${before}...${after}`,
                }));
              } catch (error) {
                runPackaging(`compare failed (${error.message})`);
                return;
              }
              // The compare API lists at most 300 files; a force push is "diverged".
              if (data?.status !== "ahead" || !Array.isArray(data.files) ||
                  data.files.length === 0 || data.files.length >= 300 ||
                  malformed(data.files)) {
                runPackaging(`compare was not a complete fast-forward (${data?.status}, ${data?.files?.length} files)`);
                return;
              }
              const hit = packagingFile(data.files);
              core.setOutput("packaging_impacting", String(hit !== undefined));
              core.notice(hit
                ? `Packaging checks run because \`${hit.filename}\` changed.`
                : "No packaging input changed; packaging checks and ARM tests are skipped.");
              return;
            }

            if (context.eventName !== "pull_request") {
              fullCi(`${context.eventName} events always run full CI`);
              return;
            }

            // Read live, so adding the label and re-running the workflow is enough.
            let labels;
            try {
              const {data} = await github.rest.pulls.get({
                owner, repo, pull_number: context.issue.number,
              });
              labels = data.labels.map((label) => label.name);
            } catch (error) {
              fullCi(`label lookup failed (${error.message})`);
              return;
            }
            if (labels.includes("full-ci")) {
              fullCi("the PR has the full-ci label");
              return;
            }

            let files;
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: context.issue.number, per_page: 100,
              });
            } catch (error) {
              fullCi(`changed-file lookup failed (${error.message})`);
              return;
            }

            const reportedCount = context.payload.pull_request.changed_files;
            if (!Array.isArray(files) || !Number.isSafeInteger(reportedCount) ||
                reportedCount <= 0 || files.length !== reportedCount) {
              fullCi(
                `changed-file list was incomplete (received ${files?.length} of ${reportedCount})`,
              );
              return;
            }

            if (malformed(files)) {
              fullCi("changed-file list had invalid or duplicate entries");
              return;
            }

            const isNonCodePath = (path) => {
              // Read by xtask's release check and its tests.
              if (path === "CHANGELOG.md") return false;
              // The MCP server compiles these in, and its tests read them.
              if (path.startsWith("skills/")) return false;
              return path === ".github/dependabot.yml" ||
                path.startsWith("docs/") ||
                path.startsWith(".agents/skills/") ||
                path.startsWith(".github/ISSUE_TEMPLATE/") ||
                path.startsWith(".github/PULL_REQUEST_TEMPLATE/") ||
                path.toLowerCase().endsWith(".md");
            };
            const codeImpactingFile = files.find((file) =>
              pathsOf(file).some((path) => !isNonCodePath(path)));
            const nonCodeOnly = codeImpactingFile === undefined;
            const isLicensePath = (path) =>
              path === "Cargo.lock" || path === "Cargo.toml" ||
              path.endsWith("/Cargo.toml") || path.startsWith("licenses/") ||
              path === "THIRD_PARTY_LICENSES" ||
              // Exercise changes to the gate and generator themselves.
              path === ".github/workflows/ci.yml" ||
              path.startsWith(".github/actions/setup-rust/") ||
              path === "xtask/src/licenses.rs";
            const licensesImpacting = files.some((file) =>
              pathsOf(file).some(isLicensePath));
            const packagingHit = packagingFile(files);

            core.setOutput("code_impacting", String(!nonCodeOnly));
            core.setOutput("licenses_impacting", String(licensesImpacting));
            core.setOutput("packaging_impacting", String(packagingHit !== undefined));
            await core.summary
              .addHeading("Changed-file classification")
              .addTable([
                [{data: "Classification", header: true}, {data: "Files", header: true}],
                [nonCodeOnly ? "Non-code only" : "Code impacting", String(files.length)],
              ])
              .addRaw(
                (nonCodeOnly
                  ? "Only documentation, agent skills, PR/issue templates or Dependabot configuration changed; expensive CI jobs are skipped."
                  : `Full CI runs because \`${codeImpactingFile.filename}\` requires it.`) +
                (packagingHit
                  ? ` Packaging checks and ARM tests run because \`${packagingHit.filename}\` changed.`
                  : " Packaging checks and ARM tests are skipped; add the full-ci label and use Re-run all jobs to force them."),
              )
              .write();

      # Here rather than in `cargo xtask lint`, which stays Rust-only. After
      # the classifier, so a failure turns this check red and, through the
      # job's result, still runs full CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test runs the PR's own script, and this job's token is the
          # only one with pull-requests: read; keep it out of .git/config.
          persist-credentials: false
      - name: Test the classifier
        run: node --test scripts/ci/classify-changes.test.cjs

      - name: Test Windows temporary storage configuration
        run: node --test scripts/ci/windows-temp.test.cjs

      - name: Test deadline model
        run: node --test scripts/ci/test-budgets.test.cjs

  licenses:
    name: Check third-party licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.licenses_impacting != 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        id: rust
        with:
          # The versioned binary cache below owns cargo-about.
          cache-bin: false

      # cargo-about's output changes between releases; keep this pin and
      # the binary cache key together, as PwrRoute pins its generator too.
      - name: Cache cargo-about
        id: cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          # The Rust that built it is part of the key, so a toolchain bump
          # rebuilds the binary instead of restoring one it did not build.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-about-0.9.2-rust-${{ steps.rust.outputs.toolchain }}

      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        # 0.9.2 requires this feature to install its binary.
        run: cargo install --locked cargo-about@0.9.2 --features cli

      - name: Check notices
        run: cargo xtask licenses --check

  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    # Lint, release check (15), compile (20), tests (10), setup.
    timeout-minutes: 60
    needs: changes
    # Runs unless the classifier succeeded and said non-code only.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What GPUI links against: windowing (Wayland, X11), input, fonts,
      # and the Vulkan loader.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      # The lint gate runs clippy and rustfmt.
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Lint
        run: cargo xtask lint

      # The macOS bundle used to be the only release-profile build, and it
      # now waits for a packaging input. Code under `debug_assertions`
      # differs between the profiles, so type-check the release one here.
      - name: Check release profile
        timeout-minutes: 15
        run: cargo check --release --workspace --locked

      # Cold GPUI code generation exceeded the old test deadline before
      # any test ran. Keep compilation out of the execution budget.
      - name: Compile Linux tests
        timeout-minutes: 20
        run: |
          cargo build -p xtask
          cargo test --workspace --no-run
          cargo test -p disktree-app --features screenshots screenshots:: --no-run

      - name: Test
        timeout-minutes: 10
        run: cargo xtask test

  check-macos:
    name: Lint and test (macOS)
    # Apple silicon. No system libraries to install, and no Metal toolchain
    # either: gpui-kit builds GPUI with runtime shader compilation, so the
    # shaders compile when the app starts, not here.
    runs-on: macos-15
    timeout-minutes: 60
    needs: changes
    # Runs unless the classifier succeeded and said non-code only.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      # Exercise native device lifecycles before compiling the GUI graph.
      # The full workspace gate repeats them alongside the deletion oracle.
      - name: APFS image lifecycle
        timeout-minutes: 10
        run: cargo test -p disktree-core test_paths::disk_image -- --test-threads=1

      - name: Lint
        run: cargo xtask lint

      # Cold test code generation exceeded ten minutes in run 42559851081.
      # Compile both feature combinations before the execution deadline.
      - name: Compile macOS tests
        timeout-minutes: 20
        run: |
          cargo build -p xtask
          cargo test --workspace --no-run
          cargo test -p disktree-app --features screenshots screenshots:: --no-run

      - name: Test
        timeout-minutes: 15
        run: cargo xtask test

      # The app bundle, signed ad hoc, and the DMG release.yml cuts the same
      # way: catches a broken Info.plist, icon, signature or DMG layout
      # before a release does. This runner's Xcode has no actool 26, so
      # this is the bundle without the Icon Composer icon. Only when a
      # packaging input changed, as bundle-macos-26.
      - name: Bundle
        if: >-
          needs.changes.result != 'success' ||
          needs.changes.outputs.packaging_impacting != 'false'
        run: cargo xtask bundle

  bundle-macos-26:
    name: Bundle (macOS 26)
    # The bundle with the Icon Composer icon: Xcode 26's actool compiles it
    # into Assets.car, and the plist names it, which the job checks.
    runs-on: macos-26
    timeout-minutes: 20
    needs: changes
    # Runs unless the classifier succeeded and said no packaging input
    # changed: on PRs, on main pushes, or with the full-ci label.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.packaging_impacting != 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust

      - name: Bundle
        run: cargo xtask bundle

      - name: Icon catalog
        run: |
          app=target/bundle/PwrDisk.app
          test -f "$app/Contents/Resources/Assets.car"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test "$(plutil -extract CFBundleIconName raw "$app/Contents/Info.plist")" = Icon

  windows:
    name: Lint and test (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    needs: changes
    # Runs unless the classifier succeeded and said non-code only.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code_impacting != 'false')
    steps:
      # The hosted runner's default TEMP is on C:, which can stall I/O.
      - name: Use runner temporary storage
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          "TEMP=$env:TEMP" >> $env:GITHUB_ENV
          "TMP=$env:TMP" >> $env:GITHUB_ENV

      # Check out with the repository's own line endings, as on Linux.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GPUI needs nothing beyond the Windows SDK the runner already has.
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Lint
        run: cargo xtask lint

      # Include the screenshot feature and shipping executable here:
      # neither later test execution nor icon validation should compile.
      - name: Compile Windows tests and executable
        timeout-minutes: 30
        run: |
          cargo build -p xtask
          cargo test --workspace --no-run
          cargo test -p disktree-app --features screenshots screenshots:: --no-run
          cargo build --locked -p disktree-app

      - name: Test
        timeout-minutes: 18
        run: cargo xtask test

      # Check the debug executable built above: build.rs embeds the icon
      # in every profile. Release builds belong to the packaging workflows.
      - name: Check embedded executable icon
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ExecutableIcons {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(
                  string file, int index, IntPtr[] large, IntPtr[] small, uint count);
          }
          '@
          $exe = (Resolve-Path target/debug/pwrdisk.exe).Path
          if ([ExecutableIcons]::ExtractIconEx($exe, -1, $null, $null, 0) -lt 1) {
            throw "pwrdisk.exe has no embedded icon"
          }

  # The same tests on the other Linux and Windows architectures the
  # release ships. Intel macOS is not tested here: the release and preview
  # builds compile the universal app, and the Intel slice is the same code
  # as the Apple silicon one `check-macos` tests.
  other-architectures:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux aarch64, runner: ubuntu-24.04-arm, job_timeout: 35, test_timeout: 8 }
          - { name: Windows aarch64, runner: windows-11-arm, job_timeout: 45, test_timeout: 15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_timeout }}
    needs: changes
    # Runs unless the classifier succeeded and said no packaging input
    # changed: on PRs, on main pushes, or with the full-ci label.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.packaging_impacting != 'false')
    steps:
      - name: Use runner temporary storage
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          "TEMP=$env:TEMP" >> $env:GITHUB_ENV
          "TMP=$env:TMP" >> $env:GITHUB_ENV

      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      - uses: ./.github/actions/setup-rust

      # A cold ARM Linux build exhausted eight minutes before tests ran.
      - name: Compile Linux tests
        if: matrix.runner == 'ubuntu-24.04-arm'
        timeout-minutes: 20
        run: |
          cargo build -p xtask
          cargo test --workspace --no-run
          cargo test -p disktree-app --features screenshots screenshots:: --no-run

      # Run 42562931627 passed the workspace suite but exhausted the gate
      # compiling screenshot-feature tests. Warm both graphs first.
      - name: Compile Windows tests
        if: matrix.runner == 'windows-11-arm'
        timeout-minutes: 25
        run: |
          cargo build -p xtask
          cargo test --workspace --no-run
          cargo test -p disktree-app --features screenshots screenshots:: --no-run

      - name: Test
        timeout-minutes: ${{ matrix.test_timeout }}
        run: cargo xtask test
